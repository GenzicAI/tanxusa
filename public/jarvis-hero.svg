<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#14261c"/>
      <stop offset="55%" stop-color="#0d0f0e"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafff4"/>
      <stop offset="35%" stop-color="#7cf0b0"/>
      <stop offset="100%" stop-color="#38e08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe8dc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGlow)"/>

  <!-- faint grid, matches the app's dark panel texture -->
  <g stroke="#1c211e" stroke-width="1" opacity="0.5">
    <line x1="0" y1="169" x2="1200" y2="169"/>
    <line x1="0" y1="338" x2="1200" y2="338"/>
    <line x1="0" y1="507" x2="1200" y2="507"/>
  </g>

  <!-- concentric orb rings, echoing the assistant's live waveform orb -->
  <g fill="none" stroke="#38e08a">
    <circle cx="600" cy="300" r="230" opacity="0.10" stroke-width="1.5"/>
    <circle cx="600" cy="300" r="175" opacity="0.16" stroke-width="1.5"/>
    <circle cx="600" cy="300" r="120" opacity="0.28" stroke-width="2"/>
  </g>
  <path d="M 470 300 Q 530 220 600 300 T 730 300" fill="none" stroke="#38e08a" stroke-width="2.5" opacity="0.55"/>
  <path d="M 500 300 Q 550 250 600 300 T 700 300" fill="none" stroke="#7cf0b0" stroke-width="2" opacity="0.5"/>

  <circle cx="600" cy="300" r="90" fill="#1f7a4c" opacity="0.35" filter="url(#softBlur)"/>
  <circle cx="600" cy="300" r="58" fill="url(#orbCore)"/>
  <circle cx="600" cy="300" r="16" fill="#ffffff"/>

  <!-- brand -->
  <text x="600" y="480" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="url(#wordmark)" letter-spacing="4">JARVIS</text>
  <text x="600" y="518" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#7fae95" letter-spacing="2">DESKTOP AI ASSISTANT</text>

  <!-- badge -->
  <rect x="497" y="548" width="206" height="34" rx="17" fill="#141816" stroke="#2a302c"/>
  <circle cx="521" cy="565" r="4" fill="#38e08a"/>
  <text x="533" y="570" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#cfe8dc">GENZIC AGENTIC AI</text>
</svg>
